# User Service Configuration

# Logging
logging.level.com.jee.shop.user=DEBUG
logging.level.org.eclipse.persistence=FINE

# Database (will be overridden by environment variables)
db.host=${DB_HOST:localhost}
db.port=${DB_PORT:5432}
db.name=${DB_NAME:webshop}
db.user=${DB_USER:webshop}
db.password=${DB_PASSWORD:webshop123}
db.schema=${DB_SCHEMA:app_user}

# JWT
jwt.secret=${JWT_SECRET:your-super-secret-jwt-key-change-in-production}
jwt.expiration.seconds=${JWT_EXPIRATION_SECONDS:3600}

# JMS
jms.host=${JMS_HOST:localhost}
jms.port=${JMS_PORT:61616}

