# API Gateway Configuration

logging.level.com.jee.shop.gateway=DEBUG

# Backend Service URLs
user.service.url=${USER_SERVICE_URL:http://localhost:8081}
order.service.url=${ORDER_SERVICE_URL:http://localhost:8082}
shipping.service.url=${SHIPPING_SERVICE_URL:http://localhost:8083}

# JWT
jwt.secret=${JWT_SECRET:your-super-secret-jwt-key-change-in-production}

# CORS
cors.allowed.origins=http://localhost:3000,http://localhost:3001
cors.allowed.methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed.headers=Content-Type,Authorization
cors.max.age=86400

