server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=30s ipv6=off;

    location = /health {
        set $api_gateway_core api-gateway-core:8080;
        proxy_pass http://$api_gateway_core/api/health;
        proxy_set_header Host $host;
    }

    location = /api {
        return 308 /api/;
    }

    location /api/ {
        set $api_gateway_core api-gateway-core:8080;
        proxy_pass http://$api_gateway_core$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The public Gateway forwards the socket unchanged; Shipping-Service
    # authenticates the user's first WebSocket frame and sends delivery events.
    location = /ws/orders {
        set $shipping_service shipping-service:8080;
        proxy_pass http://$shipping_service/shipping-service-1.0.0/ws/orders;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    location / {
        set $webshop_ui webshop-ui:3000;
        proxy_pass http://$webshop_ui$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
