name: webshop-prod

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: webshop
      POSTGRES_USER: webshop
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the prod env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webshop -d webshop"]
      interval: 10s
      timeout: 5s
      retries: 8
    networks: [user_data, order_data, shipping_data]
    restart: unless-stopped

  activemq:
    image: apache/activemq:latest
    environment:
      ACTIVEMQ_OPTS: "-Xms256m -Xmx512m"
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/61616"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 90s
    networks: [messaging]
    restart: unless-stopped

  user-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.user-service
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: webshop
      DB_USER: webshop
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the prod env file}
      DB_SCHEMA: app_user
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the prod env file}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/user-service-1.0.0/users/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [user_gateway, user_data]
    restart: unless-stopped

  order-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.order-service
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: webshop
      DB_USER: webshop
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the prod env file}
      DB_SCHEMA: orders
      JMS_HOST: activemq
      JMS_PORT: 61616
      # JWT validation is routed through the Gateway to User-Service.
      USER_SERVICE_URL: http://api-gateway-core:8080/api/users
    depends_on:
      postgres:
        condition: service_healthy
      activemq:
        condition: service_healthy
      user-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/order-service-1.0.0/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [order_gateway, order_data, messaging]
    restart: unless-stopped

  shipping-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.shipping-service
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: webshop
      DB_USER: webshop
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the prod env file}
      DB_SCHEMA: shipping
      JMS_HOST: activemq
      JMS_PORT: 61616
      USER_SERVICE_URL: http://api-gateway-core:8080/api/users
    depends_on:
      postgres:
        condition: service_healthy
      activemq:
        condition: service_healthy
      user-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/shipping-service-1.0.0/shipments/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [shipping_gateway, shipping_validation, shipping_data, messaging]
    restart: unless-stopped

  api-gateway-core:
    build:
      context: .
      dockerfile: docker/Dockerfile.api-gateway
    environment:
      USER_SERVICE_URL: http://user-service:8080/user-service-1.0.0/users
      ORDER_SERVICE_URL: http://order-service:8080/order-service-1.0.0/api/orders
      ORDER_SERVICE_API_URL: http://order-service:8080/order-service-1.0.0/api
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the prod env file}
    depends_on:
      user-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [user_gateway, order_gateway, shipping_validation, core_edge]
    restart: unless-stopped

  webshop-ui:
    build:
      context: ./webshop-ui
      dockerfile: Dockerfile
    expose: ["3000"]
    depends_on:
      api-gateway-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [ui_edge]
    restart: unless-stopped

  # Public entry point: only this service publishes a host port. It routes REST
  # to the Java Gateway, the UI to its internal container, and WS to Shipping.
  api-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.api-gateway-edge
    ports:
      - "8080:80"
    depends_on:
      api-gateway-core:
        condition: service_healthy
      webshop-ui:
        condition: service_healthy
      shipping-service:
        condition: service_healthy
    networks: [core_edge, ui_edge, shipping_gateway, public_edge]
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  public_edge:
  core_edge:
    internal: true
  shipping_validation:
    internal: true
  user_gateway:
    internal: true
  order_gateway:
    internal: true
  shipping_gateway:
    internal: true
  ui_edge:
    internal: true
  user_data:
    internal: true
  order_data:
    internal: true
  shipping_data:
    internal: true
  messaging:
    internal: true
